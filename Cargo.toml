[package]
name = "vm-provisioner"
version = "1.3.0"
edition = "2021"
description = "Lightweight VM isolation system with seamless windowing"
license = "MIT"
repository = "https://github.com/trojas-gnister/vm-provisioner"
readme = "README.md"
keywords = ["vm", "virtualization", "libvirt", "isolation", "kvm"]
categories = ["virtualization", "command-line-utilities"]

[dependencies]
# CLI parsing
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"

# Serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Error handling and logging
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"

# Cryptographic randomness
rand = "0.8"

[dev-dependencies]
tempfile = "3.12"
mockall = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lib]
name = "vm_provisioner"
path = "src/lib.rs"

[[bin]]
name = "vm-provisioner"
path = "src/main.rs"

# Legacy guest-agent and window proxy removed - replaced by Waypipe seamless integration
